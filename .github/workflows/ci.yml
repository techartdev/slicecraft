name: CI

# `cargo xtask ci` (format, clippy, tests, layering) on Linux and Windows for every push to main
# and every pull request, through the suite's shared gate workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04","windows-latest"]'
      # SliceCraft embeds no craft-fonts, has no wasm build yet, and runs its tests with cargo test.
      craft-fonts-ref: ""
      targets: ""
      tools: ""
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
